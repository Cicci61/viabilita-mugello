<style>
:root { --c: #1f2a44; --a: #ffd43b; --testo: #1f2328; --grigio: #5f6670; --fondo: #f6f7f8; --bianco: #fff; --bordo: #e2e5e9; }
@media (prefers-color-scheme: dark) { :root { --testo: #e8eaed; --grigio: #a5abb3; --fondo: #15181c; --bianco: #1e2227; --bordo: #30353c; } }
* { box-sizing: border-box; }
body { margin: 0; font: 17px/1.6 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--fondo); color: var(--testo); }
header.sito { background: var(--c); color: #fff; border-bottom: 4px solid var(--a); }
header.sito .in { max-width: 820px; margin: 0 auto; padding: 14px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
header.sito a.marchio { color: #fff; text-decoration: none; font-weight: 700; font-size: 1.2rem; }
header.sito nav { margin-left: auto; display: flex; gap: 14px; flex-wrap: wrap; }
header.sito nav a { color: #fff; text-decoration: none; opacity: .9; font-size: .95rem; }
header.sito nav a:hover { opacity: 1; text-decoration: underline; }
main { max-width: 820px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { font-size: 1.9rem; line-height: 1.2; margin: 6px 0 10px; }
.motto { color: var(--grigio); margin: 0 0 24px; }
.scheda { display: grid; grid-template-columns: 200px 1fr; gap: 16px; background: var(--bianco); border: 1px solid var(--bordo);
  border-radius: 10px; padding: 14px; margin-bottom: 14px; text-decoration: none; color: inherit; }
.scheda:hover { border-color: var(--c); }
.scheda img { width: 100%; height: 130px; object-fit: cover; border-radius: 6px; display: block; }
.scheda.senza-foto { grid-template-columns: 1fr; }
.scheda h2 { font-size: 1.2rem; margin: 2px 0 6px; line-height: 1.3; }
.scheda p { margin: 0; color: var(--grigio); font-size: .95rem; }
.meta { font-size: .85rem; color: var(--grigio); }
.sponsor { display: inline-block; background: var(--a); color: #1f2328; font-size: .72rem; font-weight: 700; letter-spacing: .4px;
  text-transform: uppercase; border-radius: 4px; padding: 2px 7px; margin-right: 6px; vertical-align: 2px; }
article .foto { margin: 18px 0; }
article .foto img { width: 100%; height: auto; border-radius: 8px; display: block; }
article .foto figcaption { font-size: .85rem; color: var(--grigio); margin-top: 6px; }
article .sommario { font-size: 1.15rem; color: var(--grigio); margin: 0 0 10px; }
article h2 { font-size: 1.25rem; margin: 28px 0 6px; }
article a { color: var(--c); }
@media (prefers-color-scheme: dark) { article a { color: var(--a); } }
.fonte { border-top: 1px solid var(--bordo); margin-top: 28px; padding-top: 12px; font-size: .9rem; color: var(--grigio); }
.nota-sponsor { background: var(--bianco); border: 1px solid var(--bordo); border-left: 4px solid var(--a); padding: 10px 14px; border-radius: 6px; font-size: .9rem; margin: 0 0 18px; }
.condividi { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
.condividi a, .condividi button { font: inherit; font-size: .9rem; background: var(--bianco); color: var(--testo); border: 1px solid var(--bordo);
  border-radius: 8px; padding: 8px 14px; text-decoration: none; cursor: pointer; }
.vuoto { background: var(--bianco); border: 1px dashed var(--bordo); border-radius: 10px; padding: 28px; text-align: center; color: var(--grigio); }
footer { text-align: center; font-size: .85rem; color: var(--grigio); padding: 0 16px 36px; }
footer a { color: inherit; }
@media (max-width: 600px) { .scheda { grid-template-columns: 1fr; } .scheda img { height: 180px; } h1 { font-size: 1.55rem; } }
</style>
